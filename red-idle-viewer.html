<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Red Tank Sprite Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #17191d;
        color: #f3f5f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 28px;
        background:
          linear-gradient(135deg, rgba(62, 73, 88, 0.22), transparent 42%),
          #17191d;
      }

      main {
        width: min(1180px, 100%);
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 22px;
        font-weight: 700;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(320px, 420px) 1fr;
        gap: 22px;
        align-items: start;
      }

      .panel {
        border: 1px solid #303641;
        border-radius: 8px;
        background: #20242b;
        padding: 18px;
      }

      .stage,
      .frame,
      .sheet-preview {
        background-color: #eef0f3;
        background-image:
          linear-gradient(45deg, #d9dde4 25%, transparent 25%),
          linear-gradient(-45deg, #d9dde4 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #d9dde4 75%),
          linear-gradient(-45deg, transparent 75%, #d9dde4 75%);
        background-position: 0 0, 0 12px, 12px -12px, -12px 0;
        background-size: 24px 24px;
      }

      .stage {
        display: grid;
        place-items: center;
        width: 100%;
        aspect-ratio: 1;
        border-radius: 8px;
        overflow: hidden;
      }

      #sprite {
        width: 86%;
        height: 86%;
        image-rendering: pixelated;
        object-fit: contain;
      }

      .controls {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }

      .button-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button,
      select {
        min-width: 84px;
        border: 1px solid #455062;
        border-radius: 6px;
        background: #2b3340;
        color: #f7f9fb;
        font: inherit;
        padding: 9px 12px;
      }

      button {
        cursor: pointer;
      }

      button:hover,
      select:hover {
        background: #354052;
      }

      label {
        display: grid;
        gap: 7px;
        color: #cbd2dc;
        font-size: 13px;
      }

      input[type="range"],
      select {
        width: 100%;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #b5beca;
        font-size: 13px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      .frame {
        display: grid;
        place-items: center;
        aspect-ratio: 1;
        border: 1px solid #394150;
        border-radius: 6px;
        overflow: hidden;
      }

      .frame img {
        width: 96%;
        height: 96%;
        object-fit: contain;
        image-rendering: pixelated;
      }

      .sheet-preview {
        margin-top: 18px;
        border: 1px solid #394150;
        border-radius: 8px;
        overflow: hidden;
      }

      .sheet-preview img {
        display: block;
        width: 100%;
        image-rendering: pixelated;
      }

      @media (max-width: 860px) {
        body {
          padding: 18px;
        }

        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Red Tank Sprite Viewer</h1>
      <div class="layout">
        <section class="panel">
          <div class="stage">
            <img id="sprite" src="public/assets/tanks/red-idle/red_idle_01.png" alt="red tank idle frame">
          </div>
          <div class="controls">
            <label>
              Action
              <select id="actionSelect"></select>
            </label>
            <div class="button-row">
              <button id="toggle" type="button">Pause</button>
              <button id="prev" type="button">Prev</button>
              <button id="next" type="button">Next</button>
            </div>
            <label>
              FPS
              <input id="fps" type="range" min="4" max="24" value="6">
            </label>
            <div class="meta">
              <span id="frameLabel">Frame 1 / 16</span>
              <span id="fpsLabel">6 fps</span>
            </div>
          </div>
        </section>

        <section class="panel">
          <div id="frameGrid" class="grid"></div>
          <div class="sheet-preview">
            <img id="sheet" src="public/assets/tanks/red-idle/red_tank_idle_4x4_transparent.png" alt="transparent 4x4 sprite sheet">
          </div>
        </section>
      </div>
    </main>

    <script>
      const actions = [
        {
          id: "red-idle",
          label: "Idle",
          folder: "public/assets/tanks/red-idle",
          prefix: "red_idle_",
          sheet: "red_tank_idle_4x4_transparent.png",
          frameCount: 16
        },
        {
          id: "red-fire",
          label: "Fire",
          folder: "public/assets/tanks/red-fire",
          prefix: "red_fire_",
          sheet: "red_tank_fire_4x4_transparent.png",
          frameCount: 16
        },
        {
          id: "blue-idle-sheet",
          label: "Blue Idle Sheet",
          folder: "public/assets/tanks",
          sheet: "tank2_idle_sheet_transparent.png",
          frameCount: 10,
          columns: 4,
          rows: 3,
          sourceFrames: [0, 1, 2, 4, 5, 6, 7, 8, 9, 11],
          normalizeAlignment: true
        },
        {
          id: "tank1-idle-sheet",
          label: "Tank 1 Idle Sheet",
          folder: "public/assets/tanks",
          sheet: "tank1_idle_sheet.png",
          frameCount: 8,
          columns: 8,
          rows: 1,
          frameWidth: 720,
          frameHeight: 420,
          frameGap: 72
        },
        {
          id: "tank2-idle-sheet-8",
          label: "Tank 2 Idle Sheet 8",
          folder: "public/assets/tanks",
          sheet: "tank2_idle_sheet_8.png",
          frameCount: 8,
          columns: 8,
          rows: 1,
          frameWidth: 720,
          frameHeight: 420,
          frameGap: 72
        },
        {
          id: "tank3-idle-sheet",
          label: "Tank 3 Idle Sheet",
          folder: "public/assets/tanks",
          sheet: "tank3_idle_sheet.png",
          frameCount: 8,
          columns: 8,
          rows: 1,
          frameWidth: 720,
          frameHeight: 420,
          frameGap: 72
        },
        {
          id: "tank5-idle-sheet",
          label: "Tank 5 Idle Sheet",
          folder: "public/assets/tanks",
          sheet: "tank5_idle_sheet.png",
          frameCount: 8,
          columns: 8,
          rows: 1,
          frameWidth: 720,
          frameHeight: 420,
          frameGap: 72
        },
        {
          id: "tank6-idle-sheet",
          label: "Tank 6 Idle Sheet",
          folder: "public/assets/tanks",
          sheet: "tank6_idle_sheet.png",
          frameCount: 8,
          columns: 8,
          rows: 1,
          frameWidth: 720,
          frameHeight: 420,
          frameGap: 72
        },
        {
          id: "tank8-idle-sheet",
          label: "Tank 8 Idle Sheet",
          folder: "public/assets/tanks",
          sheet: "tank8_idle_sheet.png",
          frameCount: 8,
          columns: 8,
          rows: 1,
          frameWidth: 720,
          frameHeight: 420,
          frameGap: 72
        },
        {
          id: "tank4-idle-sheet",
          label: "Tank 4 Idle Sheet",
          folder: "public/assets/tanks",
          sheet: "tank4_idle_sheet.png",
          frameCount: 8,
          columns: 8,
          rows: 1,
          frameWidth: 720,
          frameHeight: 420,
          frameGap: 72
        }
      ];

      const sprite = document.querySelector("#sprite");
      const actionSelect = document.querySelector("#actionSelect");
      const toggle = document.querySelector("#toggle");
      const prev = document.querySelector("#prev");
      const next = document.querySelector("#next");
      const fps = document.querySelector("#fps");
      const frameLabel = document.querySelector("#frameLabel");
      const fpsLabel = document.querySelector("#fpsLabel");
      const frameGrid = document.querySelector("#frameGrid");
      const sheet = document.querySelector("#sheet");

      let frame = 0;
      let playing = true;
      let timer = null;
      let action = actions[0];
      let frames = [];
      let imageCache = new Map();

      actions.forEach((item) => {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = item.label;
        actionSelect.appendChild(option);
      });

      async function buildFrames() {
        if (action.prefix) {
          frames = Array.from({ length: action.frameCount }, (_, index) =>
            `${action.folder}/${action.prefix}${String(index + 1).padStart(2, "0")}.png`
          );
          return;
        }

        if (!action.sheet || !action.columns || !action.rows) {
          frames = [];
          return;
        }

        const sheetSrc = `${action.folder}/${action.sheet}`;
        const sheetImage = await loadImage(sheetSrc);
        const frameWidth = action.frameWidth || Math.floor(sheetImage.naturalWidth / action.columns);
        const frameHeight = action.frameHeight || Math.floor(sheetImage.naturalHeight / action.rows);
        const frameGap = action.frameGap || 0;
        const sourceFrames = action.sourceFrames || Array.from({ length: action.frameCount }, (_, index) => index);
        frames = sourceFrames.map((sourceFrameIndex) => {
          const column = sourceFrameIndex % action.columns;
          const row = Math.floor(sourceFrameIndex / action.columns);
          return createFrameDataUrl(
            sheetImage,
            column * (frameWidth + frameGap),
            row * (frameHeight + frameGap),
            frameWidth,
            frameHeight,
            action.normalizeAlignment === true
          );
        });
      }

      function renderGrid() {
        frameGrid.replaceChildren();
        frames.forEach((src, index) => {
          const cell = document.createElement("div");
          cell.className = "frame";
          const img = document.createElement("img");
          img.src = src;
          img.alt = `${action.label} frame ${index + 1}`;
          cell.appendChild(img);
          frameGrid.appendChild(cell);
        });
      }

      async function loadAction(id) {
        action = actions.find((item) => item.id === id) || actions[0];
        frame = 0;
        await buildFrames();
        renderGrid();
        sheet.src = `${action.folder}/${action.sheet}`;
        sheet.alt = `${action.label} transparent sprite sheet`;
        render();
      }

      function render() {
        sprite.src = frames[frame];
        frameLabel.textContent = `${action.label} ${frame + 1} / ${action.frameCount}`;
      }

      function schedule() {
        clearInterval(timer);
        fpsLabel.textContent = `${fps.value} fps`;
        if (playing) {
          timer = setInterval(() => {
            frame = (frame + 1) % action.frameCount;
            render();
          }, 1000 / Number(fps.value));
        }
      }

      toggle.addEventListener("click", () => {
        playing = !playing;
        toggle.textContent = playing ? "Pause" : "Play";
        schedule();
      });

      prev.addEventListener("click", () => {
        frame = (frame - 1 + action.frameCount) % action.frameCount;
        render();
      });

      next.addEventListener("click", () => {
        frame = (frame + 1) % action.frameCount;
        render();
      });

      actionSelect.addEventListener("change", () => {
        loadAction(actionSelect.value);
      });

      fps.addEventListener("input", schedule);

      loadAction(action.id).then(schedule);

      function loadImage(src) {
        if (imageCache.has(src)) {
          return imageCache.get(src);
        }

        const promise = new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error(`Failed to load image: ${src}`));
          image.src = src;
        });

        imageCache.set(src, promise);
        return promise;
      }

      function createFrameDataUrl(image, sx, sy, sw, sh, normalizeAlignment = false) {
        const canvas = document.createElement("canvas");
        canvas.width = sw;
        canvas.height = sh;
        const context = canvas.getContext("2d");
        context.clearRect(0, 0, sw, sh);

        if (!normalizeAlignment) {
          context.drawImage(image, sx, sy, sw, sh, 0, 0, sw, sh);
          return canvas.toDataURL("image/png");
        }

        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = sw;
        tempCanvas.height = sh;
        const tempContext = tempCanvas.getContext("2d");
        tempContext.clearRect(0, 0, sw, sh);
        tempContext.drawImage(image, sx, sy, sw, sh, 0, 0, sw, sh);

        const imageData = tempContext.getImageData(0, 0, sw, sh);
        const fullBounds = getObjectBounds(imageData, sw, sh);

        if (!fullBounds) {
          return canvas.toDataURL("image/png");
        }

        const trackAnchor = getTrackAnchor(imageData, sw, sh, fullBounds);
        const boundsWidth = fullBounds.maxX - fullBounds.minX + 1;
        const boundsHeight = fullBounds.maxY - fullBounds.minY + 1;
        const alignedX = Math.round(sw / 2 - (trackAnchor.centerX - fullBounds.minX));
        const baselineY = sh - 26;
        const alignedY = Math.round(baselineY - (trackAnchor.bottomY - fullBounds.minY));

        context.drawImage(
          tempCanvas,
          fullBounds.minX,
          fullBounds.minY,
          boundsWidth,
          boundsHeight,
          alignedX,
          alignedY,
          boundsWidth,
          boundsHeight
        );
        return canvas.toDataURL("image/png");
      }

      function getObjectBounds(imageData, width, height) {
        const { data } = imageData;
        let minX = width;
        let minY = height;
        let maxX = -1;
        let maxY = -1;

        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width; x += 1) {
            if (!isObjectPixel(data, width, x, y)) continue;
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
          }
        }

        if (maxX < 0 || maxY < 0) {
          return null;
        }

        return { minX, minY, maxX, maxY };
      }

      function getTrackAnchor(imageData, width, height, fullBounds) {
        const trackStart = Math.floor(fullBounds.minY + (fullBounds.maxY - fullBounds.minY) * 0.55);
        let trackMinX = width;
        let trackMaxX = -1;
        let trackBottomY = fullBounds.maxY;

        for (let y = trackStart; y <= fullBounds.maxY; y += 1) {
          for (let x = fullBounds.minX; x <= fullBounds.maxX; x += 1) {
            if (!isTrackPixel(imageData.data, width, x, y)) continue;
            if (x < trackMinX) trackMinX = x;
            if (x > trackMaxX) trackMaxX = x;
            if (y > trackBottomY) trackBottomY = y;
          }
        }

        if (trackMaxX < trackMinX) {
          return {
            centerX: (fullBounds.minX + fullBounds.maxX) / 2,
            bottomY: fullBounds.maxY
          };
        }

        return {
          centerX: (trackMinX + trackMaxX) / 2,
          bottomY: trackBottomY
        };
      }

      function isObjectPixel(data, width, x, y) {
        const offset = (y * width + x) * 4;
        const alpha = data[offset + 3];
        if (alpha <= 8) return false;

        const red = data[offset];
        const green = data[offset + 1];
        const blue = data[offset + 2];
        const max = Math.max(red, green, blue);
        const min = Math.min(red, green, blue);
        const saturation = max - min;

        return saturation > 28 || max < 205;
      }

      function isTrackPixel(data, width, x, y) {
        const offset = (y * width + x) * 4;
        const alpha = data[offset + 3];
        if (alpha <= 8) return false;

        const red = data[offset];
        const green = data[offset + 1];
        const blue = data[offset + 2];
        const max = Math.max(red, green, blue);
        const min = Math.min(red, green, blue);
        const saturation = max - min;

        return max < 120 && saturation < 95;
      }
    </script>
  </body>
</html>
